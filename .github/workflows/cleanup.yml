name: Cleanup Old Docker Images

on:
  # Run weekly on Sundays at 2 AM UTC
  schedule:
    - cron: "0 2 * * 0"

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only report what would be deleted"
        type: boolean
        default: true

jobs:
  cleanup:
    name: Cleanup Old Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      # Retention policy is documented in the script header
      - name: Delete old images
        run: node .github/scripts/cleanup-ghcr.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          ORG: cohstats
          PACKAGE: coh3-stats
          KEEP_TAGS: "latest development production master"
          KEEP_RELEASES: 10
          KEEP_MASTER: 10
          MIN_AGE_HOURS: 24
          # Scheduled runs delete, manual runs default to dry run
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
